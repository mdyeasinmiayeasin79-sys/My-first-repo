
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Yeasin Earn</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#008000;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:400px;
margin:20px auto;
padding:15px;
}

.balance{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:20px;
}

.balance h2{
font-size:35px;
color:green;
}

.task{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.task h3{
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#008000;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#006600;
}
</style>
</head>

<body>

<header>
Bangla Yeasin Earn
</header>

<div class="container">

<div class="balance">
<h2>৳ 0.00</h2>
<p>Wallet Balance</p>
</div>

<div class="task">
<h3>🎥 Video Task 1</h3>
<p>Watch 30 Seconds</p>
<button>Watch Now</button>
</div>

<div class="task">
<h3>📢 Ad Task</h3>
<p>View One Advertisement</p>
<button>Start Task</button>
</div>

<div class="task">
<h3>💰 Withdraw</h3>
<p>Minimum Withdraw ৳500</p>
<button>Withdraw</button>
</div>

</div>

</body>
</html>
